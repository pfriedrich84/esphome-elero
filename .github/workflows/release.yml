name: Release

on:
  schedule:
    - cron: "0 6 * * 6"   # every Saturday at 06:00 UTC
  workflow_dispatch:       # allow manual trigger

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for tag lookup and changelog

      - name: Check for new commits since last release
        id: check
        run: |
          PREV_TAG=$(git tag -l --sort=-creatordate | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | head -1)
          if [ -n "$PREV_TAG" ]; then
            COUNT=$(git rev-list "${PREV_TAG}..HEAD" --count --no-merges)
            echo "New commits since $PREV_TAG: $COUNT"
          else
            COUNT=$(git rev-list HEAD --count --no-merges)
            echo "First release — $COUNT commits total"
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Determine next version tag
        if: steps.check.outputs.count != '0'
        id: version
        run: |
          YEAR_MONTH=$(date -u +%Y-%m)
          echo "year_month=$YEAR_MONTH" >> "$GITHUB_OUTPUT"

          # Find highest existing tag for this month (format: yyyy-mm-xx)
          LATEST=$(git tag -l "${YEAR_MONTH}-*" --sort=-v:refname | head -1)

          if [ -z "$LATEST" ]; then
            NEXT="${YEAR_MONTH}-01"
          else
            # Extract the counter (last segment after second dash)
            COUNTER=$(echo "$LATEST" | awk -F'-' '{print $3}')
            NEXT_NUM=$((10#$COUNTER + 1))
            NEXT=$(printf "%s-%02d" "$YEAR_MONTH" "$NEXT_NUM")
          fi

          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next release: $NEXT"

      - name: Generate changelog
        if: steps.check.outputs.count != '0'
        id: changelog
        run: |
          # Find the previous release tag (any format, most recent)
          PREV_TAG=$(git tag -l --sort=-creatordate | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | head -1)

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
            echo "First release — including all commits"
          else
            RANGE="${PREV_TAG}..HEAD"
            echo "Changelog since $PREV_TAG"
          fi

          # Collect non-merge commits
          COMMITS=$(git log "$RANGE" --pretty=format:"%s" --no-merges)

          # Categorize commits by conventional-commit prefix
          feat=""
          fix=""
          perf=""
          ci=""
          docs=""
          refactor=""
          other=""

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            case "$msg" in
              feat*)     feat="$feat"$'\n'"- $msg" ;;
              fix*)      fix="$fix"$'\n'"- $msg" ;;
              perf*)     perf="$perf"$'\n'"- $msg" ;;
              ci*|devops*) ci="$ci"$'\n'"- $msg" ;;
              docs*)     docs="$docs"$'\n'"- $msg" ;;
              refactor*|test*) refactor="$refactor"$'\n'"- $msg" ;;
              *)         other="$other"$'\n'"- $msg" ;;
            esac
          done <<< "$COMMITS"

          # Build categorized changelog
          {
            echo "## What's Changed"
            echo ""
            [ -n "$feat" ]     && echo "### New Features" && echo "$feat" && echo ""
            [ -n "$fix" ]      && echo "### Bug Fixes" && echo "$fix" && echo ""
            [ -n "$perf" ]     && echo "### Performance" && echo "$perf" && echo ""
            [ -n "$ci" ]       && echo "### CI / DevOps" && echo "$ci" && echo ""
            [ -n "$refactor" ] && echo "### Refactoring & Tests" && echo "$refactor" && echo ""
            [ -n "$docs" ]     && echo "### Documentation" && echo "$docs" && echo ""
            [ -n "$other" ]    && echo "### Other" && echo "$other" && echo ""
            echo "---"
            echo ""
            echo "**Installation:** Use \`ref: ${{ steps.version.outputs.tag }}\` in your ESPHome YAML."
          } > changelog.md

          cat changelog.md

      - name: Create release
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file changelog.md \
            --latest
