name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run when the push is a merge commit (not direct pushes or CI commits)
    if: >-
      github.event.head_commit.committer.username != 'github-actions[bot]'
      && contains(github.event.head_commit.message, 'Merge')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for tag lookup and changelog

      - name: Determine next version tag
        id: version
        run: |
          YEAR_MONTH=$(date -u +%Y-%m)
          echo "year_month=$YEAR_MONTH" >> "$GITHUB_OUTPUT"

          # Find highest existing tag for this month (format: yyyy-mm-xx)
          LATEST=$(git tag -l "${YEAR_MONTH}-*" --sort=-v:refname | head -1)

          if [ -z "$LATEST" ]; then
            NEXT="${YEAR_MONTH}-01"
          else
            # Extract the counter (last segment after second dash)
            COUNTER=$(echo "$LATEST" | awk -F'-' '{print $3}')
            NEXT_NUM=$((10#$COUNTER + 1))
            NEXT=$(printf "%s-%02d" "$YEAR_MONTH" "$NEXT_NUM")
          fi

          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next release: $NEXT"

      - name: Generate changelog
        id: changelog
        run: |
          # Find the previous release tag (any format, most recent)
          PREV_TAG=$(git tag -l --sort=-creatordate | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | head -1)

          if [ -z "$PREV_TAG" ]; then
            # No previous release tag — use all commits
            RANGE="HEAD"
            echo "First release — including all commits"
          else
            RANGE="${PREV_TAG}..HEAD"
            echo "Changelog since $PREV_TAG"
          fi

          # Build changelog from commit messages (skip merge commits)
          {
            echo "## What's Changed"
            echo ""
            git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges
            echo ""
          } > changelog.md

          cat changelog.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file changelog.md \
            --latest
