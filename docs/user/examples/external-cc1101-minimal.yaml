# Example: ESP32 with external CC1101 module
# Replace Wi-Fi secrets and Elero addresses before use.
# Use 3.3V only. Do not connect the CC1101 to 5V.

esphome:
  name: elero-external
  friendly_name: "Elero External CC1101"

esp32:
  board: esp32dev
  variant: esp32
  minimum_chip_revision: 3.1
  framework:
    type: arduino

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Elero External Fallback"
    password: !secret ap_password

captive_portal:

external_components:
  - source: github://pfriedrich84/esphome-elero

# Safe default wiring for a classic ESP32 + external CC1101.
# Avoid ESP32 strapping pins for SPI signals, especially GPIO12 as MISO.
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

elero:
  cs_pin: GPIO5
  gdo0_pin: GPIO26
  freq0: 0x7a
  freq1: 0x71
  freq2: 0x21

cover:
  - platform: elero
    name: "Dummy"
    blind_address: 0x000001
    channel: 1
    remote_address: 0x000001

button:
  - platform: elero
    name: "Elero Start Scan"
    scan_start: true
  - platform: elero
    name: "Elero Stop Scan"
    scan_start: false
