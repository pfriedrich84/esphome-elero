# Minimal managed-mode config: hub + managed registry support, no YAML-defined devices.
# YAML-only configs remain supported separately.

esphome:
  name: test-managed-minimal

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: arduino

wifi:
  ssid: "test"
  password: "testtest"

api:
  encryption:
    key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
  custom_services: true

external_components:
  - source:
      type: local
      path: ../../components

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

elero:
  cs_pin: GPIO5
  gdo0_pin: GPIO26
  auto_sensors: false

elero_managed:
  enabled: true
  max_devices: 32
  preallocated_cover_slots: 16
  preallocated_light_slots: 16
