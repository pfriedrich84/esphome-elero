# Light-only config: hub + 2 lights (on/off + dimmable), no covers
# Tests: light platform compiles standalone, both color modes

esphome:
  name: test-light-only

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: arduino

wifi:
  ssid: "test"
  password: "testtest"

external_components:
  - source:
      type: local
      path: ../../components

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

elero:
  cs_pin: GPIO5
  gdo0_pin: GPIO26

light:
  # On/off only light (no dim_duration)
  - platform: elero
    blind_address: 0xc41a2b
    channel: 6
    remote_address: 0xf0d008
    name: "On Off Light"

  # Dimmable light
  - platform: elero
    blind_address: 0xd52b3c
    channel: 8
    remote_address: 0xf0d008
    name: "Dimmable Light"
    dim_duration: 5s
