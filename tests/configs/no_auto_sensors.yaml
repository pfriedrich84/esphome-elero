# No-auto-sensors config: all auto_sensors disabled, explicit sensor declarations
# Tests: auto_sensors can be disabled, manual sensor config works

esphome:
  name: test-no-auto-sensors

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: arduino

wifi:
  ssid: "test"
  password: "testtest"

external_components:
  - source:
      type: local
      path: components

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

elero:
  cs_pin: GPIO5
  gdo0_pin: GPIO26
  auto_sensors: false

cover:
  - platform: elero
    blind_address: 0xa831e5
    channel: 4
    remote_address: 0xf0d008
    name: "Cover Manual Sensors"
    auto_sensors: false

light:
  - platform: elero
    blind_address: 0xc41a2b
    channel: 6
    remote_address: 0xf0d008
    name: "Light Manual Sensors"
    auto_sensors: false

# Explicit sensors (not auto-generated)
sensor:
  - platform: elero
    blind_address: 0xa831e5
    name: "Cover RSSI Manual"

  - platform: elero
    blind_address: 0xc41a2b
    name: "Light RSSI Manual"

text_sensor:
  - platform: elero
    blind_address: 0xa831e5
    name: "Cover Status Manual"

  - platform: elero
    blind_address: 0xc41a2b
    name: "Light Status Manual"
