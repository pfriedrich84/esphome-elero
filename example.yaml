# Compact feature overview: esphome:, wifi:, api:, ota: and logger: are omitted.
# Complete starting points: docs/user/examples/README.md
esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: arduino
    # Optional, only if your boot log suggests it (older chips won't boot):
    # advanced:
    #   minimum_chip_revision: "3.1"

external_components:
  - source: github://pfriedrich84/esphome-elero

# IMPORTANT: Avoid ESP32 strapping pins (GPIO0, GPIO2, GPIO5, GPIO12, GPIO15)
# for SPI signals. GPIO12 as MISO is especially problematic — the CC1101 can
# pull it HIGH at boot, setting VDD_SDIO to 1.8V and breaking all SPI.
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

elero:
  cs_pin: GPIO5
  gdo0_pin: GPIO26
  freq0: 0xc0
  freq1: 0x71
  freq2: 0x21
  # send_repeats: 1       # RF packet repetitions per command (1-20, default 1)
  # auto_sensors: true    # Auto-generate hub diagnostic sensors (default true)

cover:
  - platform: elero
    id: cover_schlafzimmer
    blind_address: 0xa831e5
    channel: 4
    remote_address: 0xf0d008
    name: Schlafzimmer
    open_duration: 25s
    close_duration: 22s
    poll_interval: 5min              # Optional: Status polling (default 5min, or "never")
  - platform: elero
    id: cover_wohnzimmer
    blind_address: 0xb912f3
    channel: 5
    remote_address: 0xf0d008
    name: Wohnzimmer

# Group cover - control multiple covers with a single command
elero_group:
  - name: "Alle Rollläden"
    assumed_state: true              # Optional: buttons always enabled (default true)
    members:
      - cover_schlafzimmer
      - cover_wohnzimmer

# Each cover/light auto-creates "<name> RSSI", "<name> Status" and
# "<name> Refresh" entities (auto_sensors: true). Only add sensor:/text_sensor:
# with platform: elero after setting auto_sensors: false on that cover/light,
# otherwise ESPHome reports a duplicate entity name.

# Buttons for RF discovery scan
button:
  - platform: elero
    name: "Elero Start Scan"
    scan_start: true
  - platform: elero
    name: "Elero Stop Scan"
    scan_start: false

# Web UI (auto-loads the HTTP server; only /elero is served)
# Do NOT use web_server: here — it would re-enable the unwanted default UI at /
elero_web:
  id: elero_web_ui

# Home Assistant switch to enable / disable the web UI at runtime.
# When off, all /elero routes return 503 and no RF state is served.
switch:
  - platform: elero_web
    name: "Elero Web UI"
    id: elero_web_switch
    restore_mode: RESTORE_DEFAULT_ON
